<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Word Study</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <header class="topbar">
    <a class="brand" href="index.html">
      <div class="brand-mark">W</div>
      <div class="brand-name">wordwall <em>· study</em></div>
    </a>
    <div class="topbar-right">
      <button id="themeBtn" class="theme-btn" type="button"></button>
    </div>
  </header>

  <main>
    <div class="container">

      <section class="home-hero">
        <div class="eyebrow">Word study · v1</div>
        <h1 class="h1">open source<em> word wall.</em></h1>
      </section>

      <section class="mode-grid">
        <a class="mode-card" href="quiz.html">
          <div class="num">01 / study</div>
          <h3>Start studying</h3>
          <p>Pick a category and quiz, then choose between multiple choice or typing the answer.</p>
          <div class="mode-thumb">
            <div class="thumb-quiz"><span></span><span></span><span></span><span></span></div>
          </div>
          <div class="go">
            Browse
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
          </div>
        </a>
      </section>

    </div>
  </main>

  <script src="script.js"></script>

</html>
